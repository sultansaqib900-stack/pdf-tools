name: Notify IndexNow after production deploy

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit-sitemap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default-branch submitter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit the production sitemap to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_SITE_URL: https://allaboutpdfediting.xyz
        run: node scripts/submit-indexnow.mjs
